[package]
name = "collatz-search"
version = "0.1.0"
edition = "2024"
description = "Exact large-integer Collatz searches with independent Lean certificates"
publish = false

[dependencies]
num-bigint = "0.4"
num-traits = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }
sha2 = "0.10"
sha3 = "0.10"

[profile.release]
lto = "thin"
codegen-units = 1
